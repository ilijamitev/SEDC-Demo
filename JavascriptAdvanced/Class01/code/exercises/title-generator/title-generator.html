<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Generator</title>
</head>

<body>
    <h1>Title Generator</h1>

    <label for="title-color">Select Color:</label>
    <input type="color" name="title-color" id="title-color">
    <br><br>

    <label for="title-font-size">Enter Font Size</label>
    <input type="number" min="1" max="400" name="title-font-size" id="title-font-size"> <br><br>

    <label for="title-text">Enter Text</label>
    <input type="title-text" name="title-text" id="title-text">
    <br><br>

    <button id="generateTitleBtn">Generate Title</button>

    <div id="titles"></div>

    <script src="title-generator.js"></script>
</body>

</html>
